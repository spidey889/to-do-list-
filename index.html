<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Three.js powers the lightweight background dragon. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <canvas id="three-canvas" aria-hidden="true"></canvas>
  
  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-dragon"></i>
        <h1>Dragon Tasks</h1>
      </div>
      <button class="theme-toggle" type="button" aria-label="Toggle theme">
        <i class="fas fa-moon" id="theme-icon"></i>
      </button>
    </header>

    <main>
      <div class="input-section">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="task-input" 
            placeholder="Add a new task..." 
            autocomplete="off"
          />
          <button id="add-button" type="button" aria-label="Add task">
            <i class="fas fa-plus"></i>
          </button>
        </div>
      </div>

      <div class="tasks-section">
        <div class="tasks-header">
          <h2><i class="fas fa-list-check"></i> Today</h2>
          <span class="task-count" id="task-count">0</span>
        </div>
        <div id="task-list">
          <p class="empty-message">No tasks yet. Add one above!</p>
        </div>
      </div>
    </main>

    <footer>
      <p><i class="fas fa-fire-flame-curved"></i> Clear the list. Wake the dragon.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
